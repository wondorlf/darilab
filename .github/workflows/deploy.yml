# Despliega el sitio (exportación estática de Next.js) en GitHub Pages.
# Se ejecuta en cada push a main (y manualmente desde la pestaña Actions).
#
# Requisito en GitHub: Settings → Pages → Source: "GitHub Actions"
name: Deploy Next.js site to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export -> out/)
        run: npm run build

      # Archivo CNAME: GitHub Pages exige que esté en la raíz publicada.
      - name: Create CNAME
        run: echo "darilabips.com" > ./out/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4