# Despliega el sitio (exportación estática de Next.js) en GitHub Pages.
# Se ejecuta en cada push a main (y manualmente desde la pestaña Actions).
#
# Requisito en GitHub: Settings → Pages → Source: "GitHub Actions"
#
# RUTA BASE (importante):
#  - Mientras el sitio se ve en https://<usuario>.github.io/<repo>/ → NEXT_PUBLIC_BASE_PATH='/darilab'
#  - Cuando el dominio darilabips.com apunte a GitHub Pages (registros A en el DNS de Wix +
#    dominio personalizado en Settings → Pages) el sitio se sirve en la raíz → cambiar a ''
#    y descomentar el paso que crea el archivo CNAME.
name: Deploy Next.js site to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

env:
  # Prefijo de la sub-ruta en GitHub Pages. Vacío cuando el dominio propio sirve en la raíz.
  NEXT_PUBLIC_BASE_PATH: '/darilab'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export -> out/)
        run: npm run build

      # Cuando darilabips.com ya apunte aquí: añadir el CNAME y poner
      # NEXT_PUBLIC_BASE_PATH en '' (arriba).
      # - name: Create CNAME
      #   run: echo "darilabips.com" > ./out/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
